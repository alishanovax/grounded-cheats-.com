# CI Workers Builds project name (repo: groundedcheats)
name = "grounded-cheats--com"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# false = static HTML/images/CSS serve from CDN without billing Worker requests.
# Worker still runs on cache misses (locale cannibal 301s). Set www→apex in Cloudflare Redirect Rules.
run_worker_first = false
